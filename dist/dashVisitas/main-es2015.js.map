<div class="dropsearch" [style.--pcolor]="color" [style.--w]="width" [style.margin]="margin" [style.pointerEvents]="disabled ? 'none' : 'all'">
    <ng-content></ng-content>
    <div class='shinput' [style.pointerEvents]="disabled ? 'none' : 'all'">
        <input #shdropsh [(ngModel)]="value" (keyup)='onChange($event)' (keydown)="detect($event)"
            [placeholder]="placeholder" (focus)="focus($event)" autocomplete="off"
            [disabled]="disabled" />
        <div class="shsearch" *ngIf="!value" (click)="shdropsh.focus()"></div>
        <div class="clsearch" *ngIf="value" (click)="value = ''; event.emit(null)"></div>
    </div>
    <div class='dropsh' *ngIf="values.length>0 && show" [style.width]="wdrop">
        <div class='item' *ngFor="let item of list" (click)="select(item)" >
            {{item[keylabel]}} ({{item[keyvalue]}})
        </div>
    </div>
</div>
